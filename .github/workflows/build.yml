name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.1)'
        required: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: DSHD-Setup
          - os: macos-latest
            platform: mac
            arch: x64
            artifact: DSHD
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact: DSHD

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Generate icons (macOS)
        if: matrix.platform == 'mac'
        run: npx -y electron-icon-builder --input=build/icon.png --output=build

      - name: Build Windows
        if: matrix.platform == 'win'
        run: pnpm run dist

      - name: Build macOS x64
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        run: pnpm run dist:mac --x64

      - name: Build macOS arm64
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: pnpm run dist:mac --arm64

      - name: Upload Windows artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.arch }}
          path: release/*.exe

      - name: Upload macOS artifact
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.arch }}
          path: release/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
