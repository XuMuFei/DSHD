<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2421"/>
      <stop offset="100%" stop-color="#111413"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43c982"/>
      <stop offset="100%" stop-color="#168654"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="40" y="40" width="432" height="432" rx="88" ry="88" fill="none" stroke="#2a332f" stroke-width="2"/>

  <!-- DSH Monogram: "D" main shape -->
  <g transform="translate(256, 256)">
    <!-- D letter - large vertical bar -->
    <rect x="-72" y="-104" width="48" height="208" rx="10" fill="url(#glow)"/>

    <!-- D letter - curved bowl -->
    <path d="M-24,-104 C 88,-104 128,-52 128,0 C 128,52 88,104 -24,104"
          fill="none" stroke="url(#glow)" stroke-width="48" stroke-linecap="round"/>

    <!-- Terminal chevron integrated into the D -->
    <path d="M 48,-32 L 88,0 L 48,32"
          fill="none" stroke="#111413" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Small "SH" letters to the right-bottom -->
    <g transform="translate(145, -30)" fill="#eef0eb" opacity="0.85">
      <!-- S -->
      <path d="M0,0 C 0,-18 20,-18 20,-8 C 20,0 0,0 0,8 C 0,18 20,18 20,0"
            fill="none" stroke="#eef0eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- H -->
      <path d="M32,-18 L32,18 M32,-8 L50,-8 M50,-18 L50,18"
            fill="none" stroke="#eef0eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Subtle decorative dots -->
  <circle cx="96" cy="416" r="4" fill="#43c982" opacity="0.3"/>
  <circle cx="416" cy="96" r="4" fill="#43c982" opacity="0.3"/>
</svg>